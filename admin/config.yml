backend:
  name: git-gateway
  branch: main

media_folder: "images/uploads"
public_folder: "/images/uploads"

collections:
  - name: proyectos
    label: Proyectos
    folder: "_projects"
    create: true
    slug: "{{slug}}"
    extension: "md"
    format: "frontmatter"
    editor:
      preview: false
    fields:
      - { name: title, label: Título, widget: string }
      - { name: slug, label: Slug (URL), widget: string }
      - { name: order, label: Orden en galería, widget: number }
      - { name: description, label: Descripción, widget: text }
      - { name: featured_image, label: Imagen destacada, widget: image }
      - name: photos
        label: Fotos del proyecto
        widget: list
        fields:
          - { name: imagen, label: Imagen, widget: image }
          - { name: titulo, label: Título de la foto, widget: string }
