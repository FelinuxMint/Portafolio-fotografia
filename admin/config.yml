backend:
  name: git-gateway
  branch: main

media_folder: "images/uploads"
public_folder: "/images/uploads"

collections:
  - name: galeria
    label: "Galería de Fotos"
    files:
      - file: "content/galeria.json"
        label: "Editar Galería"
        fields:
          - name: fotos
            label: Fotos
            widget: list
            allow_add: true
            allow_delete: true
            fields:
              - name: title
                label: Título
                widget: string
              - name: image
                label: Imagen
                widget: image
              - name: description
                label: Descripción
                widget: text
                required: false
              - name: project_link
                label: Enlace al proyecto
                widget: string
                required: false
