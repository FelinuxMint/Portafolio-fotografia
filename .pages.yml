collections:
  - name: proyectos
    label: Proyectos
    folder: content/proyectos
    create: true
    fields:
      - { name: title, label: Título, widget: string }
      - { name: slug, label: Slug (URL), widget: string }
      - { name: order, label: Orden en galería, widget: number }
      - { name: description, label: Descripción, widget: text }
      - { name: featuredImage, label: Imagen destacada, widget: image }
      - name: photos
        label: Fotos del proyecto
        widget: list
        fields:
          - { name: imagen, label: Imagen, widget: image }
          - { name: titulo, label: Título de la foto, widget: string }
  - name: biografia
    label: Biografía
    file: content/biografia.md
    fields:
      - { name: title, label: Título, widget: string }
      - { name: content, label: Contenido, widget: text }
  - name: contacto
    label: Contacto
    file: content/contacto.md
    fields:
      - { name: title, label: Título, widget: string }
      - { name: content, label: Contenido, widget: text }
  - name: exposiciones
    label: Exposiciones
    file: content/exposiciones.md
    fields:
      - { name: title, label: Título, widget: string }
      - { name: content, label: Contenido, widget: text }
