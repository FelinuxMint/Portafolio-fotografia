<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Portafolio de Fotografía</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/GLightbox/3.2.0/css/glightbox.min.css">
</head>
<body>

  <header class="header">
    <div class="logo">Paz Javiera</div>
    <button class="nav-toggle" aria-label="Abrir menú" aria-expanded="false">
      <span class="hamburger"></span>
    </button>
    <nav class="nav-menu">
      <a href="#inicio">Inicio</a>
      <a href="#proyectos">Proyectos</a>
      <a href="#biografia">Biografía</a>
      <a href="#contacto">Contacto</a>
    </nav>
  </header>

  <main>
    <section id="inicio" class="hero">
      <h1>Portafolio de Fotografía</h1>
      <p>Imágenes capturadas con mirada propia.</p>
    </section>

    <section id="proyectos" class="galeria">
      <!-- Se llena dinámicamente desde content/galeria.json mediante script.js -->
    </section>

    <section id="biografia">
      <h2>Biografía</h2>
      <p>Fotógrafa dedicada a capturar momentos y emociones a través de la lente.</p>
    </section>

    <section id="contacto">
      <h2>Contacto</h2>
      <p>Escríbeme para agendar una sesión o conocer más sobre mi trabajo.</p>
    </section>
  </main>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/GLightbox/3.2.0/js/glightbox.min.js"></script>
  <script src="script.js"></script>
</body>
</html>
