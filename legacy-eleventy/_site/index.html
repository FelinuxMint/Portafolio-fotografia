<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Portafolio de Fotografía – Paz Javiera</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/GLightbox/3.2.0/css/glightbox.min.css">
</head>
<body>

  <header class="header">
    <div class="logo">Paz Javiera</div>
    <button class="nav-toggle" aria-label="Abrir menú" aria-expanded="false">
      <span class="hamburger"></span>
    </button>
    <nav class="nav-menu">
      <button class="nav-close" aria-label="Cerrar menú">✕</button>
      <a href="index.html">Obra</a>
      <a href="biografia.html">Biografía</a>
      <a href="exposiciones.html">Exposiciones</a>
      <a href="proyectos.html">Proyectos</a>
      <a href="contacto.html">Contacto</a>
    </nav>
  </header>

  <main>
    
<section id="galeria" class="galeria">
  <div class="fotos-grid">
    
    <figure class="foto-item">
      <div class="foto-overlay">
        <span class="proyecto-nombre">Mapache</span>
        <a href="/mapache.html" class="btn-ver-proyecto" aria-label="Ver proyecto Mapache">👁</a>
      </div>
      <a href="/images/uploads/foto1.jpg" class="glightbox" data-gallery="portafolio">
        <img src="/images/uploads/foto1.jpg" alt="Mapache" loading="lazy">
      </a>
    </figure>
    
    <figure class="foto-item">
      <div class="foto-overlay">
        <span class="proyecto-nombre">Reptil</span>
        <a href="/reptil.html" class="btn-ver-proyecto" aria-label="Ver proyecto Reptil">👁</a>
      </div>
      <a href="/images/uploads/foto2.jpg" class="glightbox" data-gallery="portafolio">
        <img src="/images/uploads/foto2.jpg" alt="Reptil" loading="lazy">
      </a>
    </figure>
    
    <figure class="foto-item">
      <div class="foto-overlay">
        <span class="proyecto-nombre">Planta</span>
        <a href="/planta.html" class="btn-ver-proyecto" aria-label="Ver proyecto Planta">👁</a>
      </div>
      <a href="/images/uploads/foto3.jpg" class="glightbox" data-gallery="portafolio">
        <img src="/images/uploads/foto3.jpg" alt="Planta" loading="lazy">
      </a>
    </figure>
    
    <figure class="foto-item">
      <div class="foto-overlay">
        <span class="proyecto-nombre">Peludos</span>
        <a href="/peludos.html" class="btn-ver-proyecto" aria-label="Ver proyecto Peludos">👁</a>
      </div>
      <a href="/images/uploads/foto4.jpg" class="glightbox" data-gallery="portafolio">
        <img src="/images/uploads/foto4.jpg" alt="Peludos" loading="lazy">
      </a>
    </figure>
    
    <figure class="foto-item">
      <div class="foto-overlay">
        <span class="proyecto-nombre">Insecto</span>
        <a href="/insecto.html" class="btn-ver-proyecto" aria-label="Ver proyecto Insecto">👁</a>
      </div>
      <a href="/images/uploads/foto5.jpg" class="glightbox" data-gallery="portafolio">
        <img src="/images/uploads/foto5.jpg" alt="Insecto" loading="lazy">
      </a>
    </figure>
    
  </div>
</section>

  </main>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/GLightbox/3.2.0/js/glightbox.min.js"></script>
  <script src="script.js"></script>
</body>
</html>
